apiVersion: v1
data:
  01_schema.sql: "-- DevBoard (advanced branch) — minimal schema: projects + tasks
    only.\r\n-- No users table: this branch has no auth. assignee_id is just an int
    label.\r\n\r\nCREATE TABLE IF NOT EXISTS projects (\r\n    id          SERIAL
    PRIMARY KEY,\r\n    name        VARCHAR(200) NOT NULL,\r\n    description TEXT,\r\n
    \   owner_id    INTEGER,\r\n    created_at  TIMESTAMPTZ  NOT NULL DEFAULT NOW()\r\n);\r\n\r\nCREATE
    TABLE IF NOT EXISTS tasks (\r\n    id          SERIAL PRIMARY KEY,\r\n    title
    \      VARCHAR(300) NOT NULL,\r\n    description TEXT,\r\n    project_id  INTEGER
    NOT NULL REFERENCES projects(id) ON DELETE CASCADE,\r\n    assignee_id INTEGER,\r\n
    \   status      VARCHAR(20) NOT NULL DEFAULT 'todo'\r\n                CHECK (status
    IN ('todo','in_progress','blocked','done')),\r\n    priority    VARCHAR(10) NOT
    NULL DEFAULT 'medium'\r\n                CHECK (priority IN ('low','medium','high')),\r\n
    \   due_date    DATE,\r\n    created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),\r\n
    \   updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\r\n);\r\n\r\nCREATE INDEX IF
    NOT EXISTS idx_tasks_project_id ON tasks(project_id);\r\nCREATE INDEX IF NOT EXISTS
    idx_tasks_status     ON tasks(status);\r\n\r\n-- Auto-update updated_at on row
    modifications.\r\nCREATE OR REPLACE FUNCTION touch_updated_at() RETURNS TRIGGER
    AS $$\r\nBEGIN\r\n    NEW.updated_at = NOW();\r\n    RETURN NEW;\r\nEND;\r\n$$
    LANGUAGE plpgsql;\r\n\r\nDROP TRIGGER IF EXISTS tasks_touch_updated_at ON tasks;\r\nCREATE
    TRIGGER tasks_touch_updated_at\r\n    BEFORE UPDATE ON tasks\r\n    FOR EACH ROW\r\n
    \   EXECUTE FUNCTION touch_updated_at();\r\n"
  02_seed.sql: "-- Seed data so the UI has something to render on first boot.\r\n--
    Mirrors the fundamentals branch's mock store: \"DevBoard MVP\" (id 1) with\r\n--
    8 tasks across statuses, plus a small second project.\r\n\r\nINSERT INTO projects
    (id, name, description, owner_id) VALUES\r\n    (1, 'DevBoard MVP',   'Ship the
    v1 task tracker', 1),\r\n    (2, 'Marketing Site', 'Landing page + launch blog',
    1)\r\nON CONFLICT (id) DO NOTHING;\r\n\r\nINSERT INTO tasks (title, description,
    project_id, assignee_id, status, priority, due_date) VALUES\r\n    ('Design the
    task schema',     'projects, tasks, statuses',     1, 1, 'done',        'high',
    \  '2026-05-05'),\r\n    ('Build the kanban board',     'drag and drop columns',
    \        1, 2, 'in_progress', 'high',   '2026-06-18'),\r\n    ('Wire up the dashboard
    hero', 'velocity + chip stats',         1, 1, 'in_progress', 'medium', '2026-06-20'),\r\n
    \   ('Add the command bar',        'global search',                 1, 3, 'todo',
    \       'medium', '2026-06-25'),\r\n    ('Dark mode polish',           'grain
    + gradients',             1, 2, 'todo',        'low',    NULL),\r\n    ('Fix flaky
    avatar colors',    'hash collision on initials',    1, 1, 'blocked',     'high',
    \  '2026-06-15'),\r\n    ('Write component tests',      'Vitest + testing-library',
    \     1, 3, 'todo',        'medium', NULL),\r\n    ('Ship the v1 release',        'tag
    and announce',              1, 1, 'todo',        'high',   '2026-06-30'),\r\n
    \   ('Draft the launch blog post', '',                              2, 2, 'in_progress',
    'medium', '2026-06-22'),\r\n    ('Hero illustration',          '',                              2,
    3, 'todo',        'low',    NULL);\r\n\r\n-- Keep the projects sequence past the
    explicit ids we inserted.\r\nSELECT setval('projects_id_seq', (SELECT MAX(id)
    FROM projects));\r\n"
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: devboard
