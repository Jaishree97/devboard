# Goal - Ensure application packages and dependencies are audited for security

name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Go Vulnerability Scan
        continue-on-error: true
        run: govulncheck ./... | tee govulncheck-report.txt
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Node Dependency Scan
        continue-on-error: true
        run: npm audit | tee npm-audit-report.txt
        working-directory: frontend

      - name: Upload Dependency Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: |
            backend/govulncheck-report.txt
            frontend/npm-audit-report.txt
          retention-days: 5