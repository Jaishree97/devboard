# Goal - Run the current DevSecOps CI/CD pipeline

name: DevSecOps CI

on:
  push:
    branches:
      - main
      
  pull_request:
    branches:
      - main

jobs:

  # ---------------- CI ----------------

  # Code Quality
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  # Code Tests
  code-tests:
    uses: ./.github/workflows/code-tests.yml

  # Secret Scanning
  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml

  # Dependency Security
  dependency-checks:
    uses: ./.github/workflows/dependency-scan.yml

  # Dockerfile + Container Image Security
  docker-checks:
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit

  # SonarQube
  sonar-qube:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit

  # ---------------- CI/CD ----------------

  # Push images to Docker Hub only after all CI checks pass
  docker-push:
    needs:
      - code-quality
      - code-tests
      - secret-scanning
      - dependency-checks
      - docker-checks
      - sonar-qube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-push.yml
    secrets: inherit

  # Deploy only after Docker images are pushed
  deploy:
    needs:
      - docker-push
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # DAST after deployment
  dast-scan:
    needs:
      - deploy
    uses: ./.github/workflows/dast.yml
    secrets: inherit