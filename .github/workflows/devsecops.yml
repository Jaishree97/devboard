# Goal - Run the current DevSecOps CI pipeline

name: DevSecOps CI

on:
  push:
    branches:
      - main
      - feature/devsecops-pipeline

  pull_request:
    branches:
      - main

jobs:

  # Code Quality
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  # Code Tests
  code-tests:
    uses: ./.github/workflows/code-tests.yml

  # Secret Scanning
  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml

  # Dependency Security
  dependency-checks:
    uses: ./.github/workflows/dependency-scan.yml

  # Dockerfile + Container Image Security
  docker-checks:
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit
